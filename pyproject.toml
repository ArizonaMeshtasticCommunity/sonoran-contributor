[project]
name = "rf-agent"
version = "0.2.1"
description = "Reads the decoders beside a member's SDR and publishes what they hear to the community broker."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomqtt>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1.4",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
rf-agent = "rf_agent.agent:run"
rf-sweep = "rf_agent.sweep:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rf_agent"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ASYNC", # flake8-async
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-local-folder = ["conftest", "encode", "make_captures"]

[tool.ruff.lint.per-file-ignores]
# Tests wait on a condition by polling; that is fine outside the agent.
"tests/**" = ["ASYNC110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
