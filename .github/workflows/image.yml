name: Image

# Publishes ghcr.io/arizonameshtasticcommunity/sonoran-contributor,
# rf-agent (the same image, under its old name, for stations that pull
# `rf-agent:1`), rf-sweep and rf-registrar.
#
# A tag `v1.2.3` publishes `1.2.3`, `1.2` and `1`, so a member who runs
# `rf-agent:1` gets every compatible release. `main` publishes `main`.
# The rules are in tools/image_tags.sh.
#
# Actions here must be pinned to a commit, and only the few that the
# repository's Actions settings list may run (see ci.yml). So this uses
# the Docker CLI that the runner already has, not the docker/* actions.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: sonoran-contributor
            file: Dockerfile
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - name: rf-agent
            file: Dockerfile
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - name: rf-sweep
            file: Dockerfile.sweep
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          # Runs beside the broker, never at a station.
          - name: rf-registrar
            file: Dockerfile.registrar
            platforms: linux/amd64,linux/arm64
    env:
      IMAGE: ghcr.io/arizonameshtasticcommunity/${{ matrix.name }}
      FILE: ${{ matrix.file }}
      PLATFORMS: ${{ matrix.platforms }}
      # Pinned by digest, like the actions. Keep in step with ci.yml.
      BINFMT_IMAGE: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      BUILDKIT_IMAGE: moby/buildkit@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU and a multi-platform builder
        run: |
          docker run --privileged --rm "$BINFMT_IMAGE" --install arm64,arm
          docker buildx create --name multi --driver docker-container \
            --driver-opt "image=$BUILDKIT_IMAGE" --use
          docker buildx inspect --bootstrap
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # An assignment, so a ref the script refuses stops the job.
          tags=$(tools/image_tags.sh "$IMAGE" "$REF")
          args=()
          while read -r tag; do
            args+=(--tag "$tag")
          done <<<"$tags"
          # The source label links the package to this repository.
          docker buildx build \
            --platform "$PLATFORMS" \
            --file "$FILE" \
            "${args[@]}" \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.title=${IMAGE##*/}" \
            --push \
            .
      - name: Log out
        if: always()
        run: docker logout ghcr.io
