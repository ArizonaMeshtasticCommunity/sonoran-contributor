name: Image

# Publishes ghcr.io/arizonameshtasticcommunity/sonoran-contributor,
# rf-agent (the same image, under its old name, for stations that pull
# `rf-agent:1`), rf-sweep and rf-registrar.
#
# A tag `v1.2.3` publishes `1.2.3`, `1.2` and `1`, so a member who runs
# `rf-agent:1` gets every compatible release. `main` publishes `main`.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: sonoran-contributor
            file: Dockerfile
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - name: rf-agent
            file: Dockerfile
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - name: rf-sweep
            file: Dockerfile.sweep
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          # Runs beside the broker, never at a station.
          - name: rf-registrar
            file: Dockerfile.registrar
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/arizonameshtasticcommunity/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
